name: Deploy Customer Categorizer API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/app && cd ~/app

            # Pull latest code or clone if missing
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/anjanpal2001/Customer_Categorizer_Project.git .
            fi

            # Build and restart Docker container
            docker build -t customer-categorizer-api .
            docker stop categorizer-app || true
            docker rm categorizer-app || true
            docker run -d -p 8000:8000 --name categorizer-app customer-categorizer-api
