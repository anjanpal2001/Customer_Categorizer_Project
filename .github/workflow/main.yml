name: Customer Categorizer CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Unit Tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest || echo "No tests configured, skipping..."

    - name: SSH and Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to project or clone if missing
          if [ ! -d "Customer-Categorizer" ]; then
            git clone https://github.com/${{ github.repository }}.git Customer-Categorizer
          fi
          cd Customer-Categorizer
          
          # Pull latest changes
          git pull origin main
          
          # Rebuild and run Docker container
          docker stop customer-categorizer-container || true
          docker rm customer-categorizer-container || true
          docker build -t customer-categorizer-app .
          docker run -d --name customer-categorizer-container -p 8000:8000 customer-categorizer-app